<div
  class="staff-layout"
  [class.staff-layout--collapsed]="sidebarCollapsed"
>

  <app-sidebar
    [collapsed]="sidebarCollapsed"
    (collapsedChange)="onSidebarChange($event)"
  ></app-sidebar>

  <section class="staff-layout__main">
    <app-topbar
      (toggleSidebar)="toggleSidebar()"
    ></app-topbar>

    <main class="staff-layout__content">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
