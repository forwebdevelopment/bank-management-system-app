<mat-card class="insights-card">
  <mat-card-header>
    <mat-card-title>Quick Insights</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <div class="insights-list">
      
      <!-- Top Performing Branch -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame gold">
            <mat-icon>star</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">Highest Performing Branch</span>
            <span class="metric-value">Mumbai Main Branch</span>
          </div>
        </div>
      </div>

      <!-- Highest Deposit Today -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame blue">
            <mat-icon>arrow_upward</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">Highest Deposit Today</span>
            <span class="metric-value">₹ 226 Cr</span>
          </div>
        </div>
      </div>

      <!-- Total Transactions Today -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame purple">
            <mat-icon>swap_horiz</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">Total Transactions Today</span>
            <span class="metric-value">12,458</span>
          </div>
        </div>
      </div>

      <!-- Active Loans Volume -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame green">
            <mat-icon>account_balance</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">Active Loans</span>
            <span class="metric-value">₹ 1,245 Cr</span>
          </div>
        </div>
      </div>

      <!-- Pending Approvals Action Banner -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame orange">
            <mat-icon>hourglass_empty</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">Pending Approvals</span>
            <span class="metric-value">248</span>
          </div>
        </div>
        <span class="action-badge warning">Action Required</span>
      </div>

      <!-- System Performance Status Tracker -->
      <div class="insight-item">
        <div class="item-left">
          <div class="icon-frame teal">
            <mat-icon>dns</mat-icon>
          </div>
          <div class="meta-texts">
            <span class="metric-label">System Performance</span>
            <span class="metric-value">Excellent</span>
          </div>
        </div>
        <span class="action-badge success">Healthy</span>
      </div>

    </div>
  </mat-card-content>
</mat-card>
