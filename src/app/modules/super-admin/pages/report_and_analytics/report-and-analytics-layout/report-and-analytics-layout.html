<div class="dashboard-container">
  
  <!-- NEW: Sub-Header Section -->
  <header class="report-header">
    <div class="header-left">
      <h1>Reports & Analytics</h1>
      <p>View banking insights, monitor KPIs, and generate downloadable reports.</p>
    </div>
    <div class="header-actions">
      <button mat-flat-button color="primary">
        <mat-icon>add_circle_outline</mat-icon> Generate Report
      </button>
      <button mat-stroked-button class="btn-pdf">
        <mat-icon>picture_as_pdf</mat-icon> Export PDF
      </button>
      <button mat-stroked-button class="btn-excel">
        <mat-icon>table_view</mat-icon> Export Excel
      </button>
      <button mat-stroked-button>
        <mat-icon>print</mat-icon> Print
      </button>
      <button mat-stroked-button>
        <mat-icon>refresh</mat-icon> Refresh
      </button>
    </div>
  </header>

  <!-- ROW 1: Full-Width KPI Metrics Section -->
  <section class="layout-row full-width-row">
     <app-report-summary-card></app-report-summary-card>
    <!-- <div class="component-placeholder kpi-placeholder">
     
    </div> -->
  </section>

  <!-- ROW 2: 3-Column Analytics Layout -->
  <section class="layout-row grid-3-columns">
   <app-monthly-banking-performance></app-monthly-banking-performance>
     
     <app-account-distribution></app-account-distribution>

    <app-quick-insights></app-quick-insights>
  </section>

  <!-- ROW 3: 3-Column Breakdown Layout -->
  <section class="layout-row grid-3-columns">
   <app-branch-performance></app-branch-performance>
   <app-customer-distribution></app-customer-distribution>
  <app-available-reports></app-available-reports>
  </section>

  <!-- ROW 4: Full-Width Recent Reports Table Section -->
  <section class="layout-row full-width-row">
  <app-recent-generated-reports></app-recent-generated-reports>
  </section>

</div>
