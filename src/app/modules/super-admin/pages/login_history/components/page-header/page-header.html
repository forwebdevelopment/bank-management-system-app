<div class="page-header-container">
  
  <!-- Left Side: Titles -->
  <div class="header-titles">
    <h1 class="page-title">Login History</h1>
    <p class="page-subtitle">
      Monitor user login activity, authentication events, device information, and security status across the banking system.
    </p>
  </div>

  <!-- Right Side: Action Buttons -->
  <div class="header-actions">
    
    <button mat-flat-button color="primary" class="action-btn primary-btn" (click)="exportHistory()">
      <mat-icon>file_upload</mat-icon>
      Export Login History
    </button>
    
    <button mat-stroked-button class="action-btn secondary-btn" (click)="exportpdf.emit()">
      <mat-icon>picture_as_pdf</mat-icon>
      Download PDF
    </button>
    
    <button mat-stroked-button class="action-btn secondary-btn" >
      <mat-icon>refresh</mat-icon>
      Refresh
    </button>

  </div>
</div>
