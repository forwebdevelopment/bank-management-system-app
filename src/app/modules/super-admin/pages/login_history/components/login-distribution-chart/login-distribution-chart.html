<div class="distribution-card">

  <!-- Header Section with Custom UI Dropdown Wrapper -->
  <div class="card-header-bar">
    <h3 class="title-text">Login Distribution</h3>
    
    <div class="custom-dropdown-container">
      <div class="dropdown-trigger" (click)="toggleDropdown()">
        <span>{{ selectedTimeframe }}</span>
        <span class="arrow-icon">▼</span>
      </div>
      
      <!-- Custom unordered list dropdown interface execution -->
      <ul class="dropdown-menu-list" [class.show]="isDropdownOpen">
        <li *ngFor="let option of timeframeOptions" 
            (click)="selectTimeframe(option)"
            [class.active]="option === selectedTimeframe">
          {{ option }}
        </li>
      </ul>
    </div>
  </div>

  <!-- Main Responsive Visual Graphic Layout Container -->
  <div class="chart-content-layout">
    
    <!-- Donut Target Ring Container Frame Area -->
    <div class="chart-container-box">
      <!-- The Chart.js Target Canvas Reference Node -->
      <canvas #donutCanvas></canvas>
      
      <!-- Inside Core Text Block Labels Center Placement Overlay -->
      <div class="donut-center-labels">
        <span class="total-count-value">2,458</span>
        <span class="total-label-subtitle">Total Logins</span>
      </div>
    </div>

    <!-- Data Legend Multi-Row Loop Channel -->
    <ul class="legend-items-list">
      <li *ngFor="let item of distributionData" class="legend-row-item">
        <div class="legend-label-left">
          <span class="color-dot-indicator" [ngClass]="item.colorClass"></span>
          <span class="role-title-text">{{ item.role }}</span>
        </div>
        <div class="legend-metrics-right">
          <span class="percentage-metric-value">{{ item.percentage }}</span>
          <span class="raw-count-metric">({{ item.count }})</span>
        </div>
      </li>
    </ul>

  </div>
</div>
