<div class="active-sessions-card">
  
  <!-- Card Header -->
  <div class="card-header">
    <div class="title-group">
      <h3 class="card-title">Active Sessions</h3>
      <span class="session-count">(326)</span>
    </div>
    
    <button class="view-all-btn">
      View All
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <!-- Responsive Table Wrapper -->
  <div class="table-responsive-wrapper">
    <table class="sessions-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Branch</th>
          <th>Login Time</th>
          <th class="text-center">Device</th>
          <th>Duration</th>
          <th class="text-center">Status</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>
      
      <tbody>
        <tr *ngFor="let session of activeSessions; let last = last" [class.no-border]="last">
          
          <!-- User Profile -->
          <td>
            <div class="user-profile">
              <div class="avatar">{{ session.avatarInitials }}</div>
              <span class="user-name">{{ session.name }}</span>
            </div>
          </td>
          
          <td class="text-secondary">{{ session.branch }}</td>
          <td class="text-secondary">{{ session.loginTime }}</td>
          
          <!-- Device Icons -->
          <td class="text-center icon-cell">
            <!-- Desktop Icon -->
            <svg *ngIf="session.device === 'desktop'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <!-- Mobile Icon -->
            <svg *ngIf="session.device === 'mobile'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
          </td>
          
          <td class="text-secondary">{{ session.duration }}</td>
          
          <!-- Status Badge -->
          <td class="text-center">
            <span class="status-badge badge-active">{{ session.status }}</span>
          </td>
          
          <!-- Action Terminate Button -->
          <td class="text-center">
            <button class="action-btn terminate-btn" (click)="terminateSession(session.name)" title="Terminate Session">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
              </svg>
            </button>
          </td>
          
        </tr>
      </tbody>
    </table>
  </div>

</div>
