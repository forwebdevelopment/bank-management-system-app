<div class="active-sessions-card">
  
  <!-- Header Component Title Metadata Row -->
  <div class="card-header-bar">
    <h3 class="title-text">Active Sessions <span class="counter-badge">(326)</span></h3>
    <button mat-button color="primary" class="view-all-btn">
      View All <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>

  <!-- Core Table Responsive Frame Wrapper Layout -->
  <div class="table-scroll-container">
    <table mat-table [dataSource]="sessionDataSource" class="mat-elevation-z0 sessions-mat-table">

      <!-- User Information Column Layout (Loop Item) -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef class="table-header-title">User</th>
        <td mat-cell *matCellDef="let element" class="user-profile-cell">
          <div class="avatar-fallback-wrapper">
            <!-- Normalizes profile display formatting layout directly -->
            <img [src]="element.avatarUrl" alt="User Profile Image" class="avatar-img" />
          </div>
          <span class="user-display-name">{{element.userName}}</span>
        </td>
      </ng-container>

      <!-- Assigned Branch Location Column Loop Item -->
      <ng-container matColumnDef="branch">
        <th mat-header-cell *matHeaderCellDef class="table-header-title">Branch</th>
        <td mat-cell *matCellDef="let element" class="standard-text-cell">{{element.branch}}</td>
      </ng-container>

      <!-- Timestamp Exact Login Time Column Loop Item -->
      <ng-container matColumnDef="loginTime">
        <th mat-header-cell *matHeaderCellDef class="table-header-title">Login Time</th>
        <td mat-cell *matCellDef="let element" class="standard-text-cell">{{element.loginTime}}</td>
      </ng-container>

      <!-- Device Access Type Hardware Icon Column Loop Item -->
      <ng-container matColumnDef="device">
        <th mat-header-cell *matHeaderCellDef class="table-header-title text-center">Device</th>
        <td mat-cell *matCellDef="let element" class="text-center icon-cell">
          <mat-icon class="device-render-icon">{{element.deviceIcon}}</mat-icon>
        </td>
      </ng-container>

      <!-- Active Connection Running Counter Time Duration Loop Item -->
      <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef class="table-header-title">Duration</th>
        <td mat-cell *matCellDef="let element" class="monospace-time-cell">{{element.duration}}</td>
      </ng-container>

      <!-- Current Processing Status Flag Column Loop Item -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="table-header-title">Status</th>
        <td mat-cell *matCellDef="let element">
          <span class="status-chip active-status-chip">{{element.status}}</span>
        </td>
      </ng-container>

      <!-- Session Kill/Force Logout Master Action Loop Button -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef class="table-header-title text-center">Action</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button color="warn" (click)="onTerminateSession(element.userName)" matTooltip="Terminate Session">
            <mat-icon class="terminate-action-icon">cancel</mat-icon>
          </button>
        </td>
      </ng-container>

      <!-- Contextual Direct Binding Rules Initialization Loops -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="session-data-row-hover"></tr>
    </table>
  </div>

</div>
