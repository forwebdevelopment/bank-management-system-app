<div class="workspace-viewport">

  <!-- Section 1: Full-Width View Header Component Container -->

    <app-page-header (export)="ExportHistoryInCSV(undefined)" (exportpdf)="ExportHistoryInPdf()"></app-page-header>


  <!-- Section 2: Full-Width KPI Summary Deck Container -->
<app-summary-card></app-summary-card>

  <!-- Section 3: Full-Width Filter Controls & Table Container -->
  <app-login-history-table (export)="ExportHistoryInCSV($event)"></app-login-history-table>

  <!-- Bottom Analytics Layout Channel (Fluid 4-Column Responsive Row Grid) -->
  <footer class="analytics-responsive-grid">

    <!-- Block A: Login Activity -->
   <app-login-activity-chart></app-login-activity-chart>

    <!-- Block B: Login Distribution -->
   <app-login-distribution-chart></app-login-distribution-chart>

    <!-- Block C: Active Session -->
    <app-active-sessions-list></app-active-sessions-list>

    <!-- Block D: Security Alert -->
    <app-security-alerts-panel></app-security-alerts-panel>

  </footer>

</div>
