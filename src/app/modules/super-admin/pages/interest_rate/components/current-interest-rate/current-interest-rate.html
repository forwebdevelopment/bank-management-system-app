<div class="analytics-card-container">
  
  <!-- Content Context Header Strip -->
  <header class="chart-header-block">
    <div class="header-title-stack">
      <h3 class="chart-main-title">Current Interest Rates by Product</h3>
      <p class="chart-sub-title">Visual product variance comparison breakdown matrix</p>
    </div>
  </header>

  <!-- High Performance Canvas Render Arena Box Frame -->
  <div class="chart-canvas-viewport">
    <canvas 
      baseChart 
      [data]="barChartData" 
      [options]="barChartOptions" 
      [type]="barChartType">
    </canvas>
  </div>

</div>
