<div class="analytics-card-container">
  
  <!-- Content Context Header Strip -->
  <header class="chart-header-block">
    <div class="header-title-stack">
      <h3 class="chart-main-title">Interest Rate Trend</h3>
      <p class="chart-sub-title">12-Month historical tracking metrics analysis</p>
    </div>
  </header>

  <!-- High Performance Canvas Render Arena Box Frame -->
  <div class="chart-canvas-viewport">
    <canvas 
      baseChart 
      [data]="lineChartData" 
      [options]="lineChartOptions" 
      [type]="lineChartType">
    </canvas>
  </div>

</div>
