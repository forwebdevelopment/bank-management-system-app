<main class="account-directory-layout">
  <!-- Left Side: Main Workspace Container -->
  <div class="workspace-main">
    <!-- Section 1: Header Component -->
    <header class="layout-header">
     <app-account-dire-header></app-account-dire-header>
    </header>

    <!-- Section 2: Metrics Summary Rows -->
    <section class="layout-metrics">
      <!-- <app-account-metrics></app-account-metrics> -->
      <app-account-dire-summary-card></app-account-dire-summary-card>
    </section>

    <!-- Section 3: Filters & Data Grid Table -->
    <section class="layout-content">
     <app-account-dire-account-list (viewAccount)="showAccountDetails($event)"></app-account-dire-account-list>
    </section>
  </div>

  <!-- Right Side: Section 4 - Account Details Sidebar -->
   @if (this.accountDetials) {
  <aside class="workspace-sidebar"  >
     <app-account-dire-account-details (AccountDetails)="this.accountDetials"></app-account-dire-account-details>
  </aside>
}
</main>
