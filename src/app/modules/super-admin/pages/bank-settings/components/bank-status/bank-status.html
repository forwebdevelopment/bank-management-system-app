<div class="custom-card full-width-card">
  <div class="card-header">
    <svg xmlns="http://w3.org" class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
    </svg>
    <h2 class="card-title">7. Bank Status Monitoring Strip</h2>
  </div>

  <div class="card-content">
    <div class="status-strip-grid">
      
      <!-- Loop drawing status dashboard item blocks -->
      <div class="status-item-block" *ngFor="let service of servicesList" [ngClass]="service.status.toLowerCase()">
        <div class="item-left">
          <span class="service-name">{{ service.name }}</span>
          <span class="status-text-label">{{ service.status }}</span>
        </div>
        
        <!-- Condition Check Verification Overlay Badges -->
        <div class="status-icon-badge">
          <!-- Inline checkmark SVG graphic -->
          <svg xmlns="http://w3.org" viewBox="0 0 20 20" fill="currentColor" class="check-icon">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>

    </div>
  </div>
</div>
