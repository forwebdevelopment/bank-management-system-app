<div class="dense-card">
  <div class="card-header">
    <svg xmlns="http://w3.org" class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
    </svg>
    <h2 class="card-title">1. Bank Information</h2>
  </div>

  <div class="card-content">
    <form [formGroup]="bankForm" class="dense-layout-split">
      
      <!-- Inputs Column -->
      <div class="inputs-grid-column">
        
        <fieldset class="dense-fieldset full-width">
          <legend>Bank Name<span class="required">*</span></legend>
          <input type="text" formControlName="bankName" placeholder="Enter bank name">
        </fieldset>

        <div class="inputs-row-split">
          <fieldset class="dense-fieldset">
            <legend>Bank Short Name<span class="required">*</span></legend>
            <input type="text" formControlName="bankShortName" placeholder="e.g. GTB">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>IFSC Prefix<span class="required">*</span></legend>
            <input type="text" formControlName="ifscPrefix" placeholder="e.g. GTBL000">
          </fieldset>
        </div>

        <div class="inputs-row-split">
          <fieldset class="dense-fieldset class-focused">
            <legend>Bank Code<span class="required">*</span></legend>
            <input type="text" formControlName="bankCode" placeholder="e.g. GTB001">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>Bank Registration Number<span class="required">*</span></legend>
            <input type="text" formControlName="bankRegistrationNumber" placeholder="Enter number">
          </fieldset>
        </div>

        <div class="inputs-row-split">
          <fieldset class="dense-fieldset">
            <legend>SWIFT Code<span class="required">*</span></legend>
            <input type="text" formControlName="swiftCode" placeholder="Enter code">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>Tax Identification Number<span class="required">*</span></legend>
            <input type="text" formControlName="taxIdNumber" placeholder="Enter TIN">
          </fieldset>
        </div>

      </div>

      <!-- Uploaders Column -->
      <div class="media-uploaders-sidebar">
        
        <div class="uploader-component-box">
          <span class="uploader-label">Bank Logo</span>
          <div class="asset-preview-canvas">
            <img *ngIf="logoPreview" [src]="logoPreview" alt="Logo">
            <svg *ngIf="!logoPreview" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" class="placeholder-svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          </div>
          <input type="file" id="bankLogoInput" class="hidden-file-input" (change)="onLogoChange($event)" accept="image/png, image/jpeg">
          <label for="bankLogoInput" class="custom-action-btn">Change</label>
          <span class="spec-hint-text">JPG, PNG (Max. 2MB)</span>
        </div>

        <div class="uploader-component-box">
          <span class="uploader-label">Bank Favicon</span>
          <div class="asset-preview-canvas square-box">
            <img *ngIf="faviconPreview" [src]="faviconPreview" alt="Favicon">
            <svg *ngIf="!faviconPreview" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" class="placeholder-svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
          </div>
          <input type="file" id="bankFaviconInput" class="hidden-file-input" (change)="onFaviconChange($event)" accept="image/x-icon, image/png">
          <label for="bankFaviconInput" class="custom-action-btn">Change</label>
          <span class="spec-hint-text">ICO, PNG (Max. 512KB)</span>
        </div>

      </div>

    </form>
  </div>
</div>
