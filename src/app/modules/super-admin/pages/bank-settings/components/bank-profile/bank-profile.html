<mat-card class="original-profile-card">
  
  <!-- Section Title -->
  <div class="profile-card-header">
    <h3 class="panel-title">Bank Profile</h3>
  </div>

  <!-- Centered Circular Institution Emblem -->
  <div class="emblem-center-wrapper">
    <div class="blue-circle-logo">
      <mat-icon class="white-bank-icon">account_balance</mat-icon>
      <div class="logo-subtext">GLOBAL TRUST BANK</div>
    </div>
  </div>

  <!-- Institution Legal Name Left-Aligned -->
  <div class="legal-title-container">
    <h4 class="legal-name-text">Global Trust Bank Limited</h4>
  </div>

  <!-- Unified Vertical Metrics List Rows (No borders) -->
  <div class="metrics-list-rows">
    
    <!-- Row 1: Total Branches -->
    <div class="metric-line">
      <div class="metric-label-group">
        <mat-icon class="row-icon">corporate_fare</mat-icon>
        <span class="label-text">Total Branches</span>
      </div>
      <span class="value-text">125</span>
    </div>

    <!-- Row 2: Total Customers -->
    <div class="metric-line">
      <div class="metric-label-group">
        <mat-icon class="row-icon">people_outline</mat-icon>
        <span class="label-text">Total Customers</span>
      </div>
      <span class="value-text">2,45,680</span>
    </div>

    <!-- Row 3: Total Accounts -->
    <div class="metric-line">
      <div class="metric-label-group">
        <mat-icon class="row-icon">credit_card</mat-icon>
        <span class="label-text">Total Accounts</span>
      </div>
      <span class="value-text">3,78,910</span>
    </div>

    <!-- Row 4: Current Version -->
    <div class="metric-line">
      <div class="metric-label-group">
        <mat-icon class="row-icon">update</mat-icon>
        <span class="label-text">Current Version</span>
      </div>
      <span class="value-text">v1.0.0</span>
    </div>

  </div>

</mat-card>
