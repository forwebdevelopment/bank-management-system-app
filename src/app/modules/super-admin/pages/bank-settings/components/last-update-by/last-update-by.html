<div class="custom-sidebar-card footer-stamp-card">
  <div class="stamp-content-layout">
    
    <!-- Left Column: Clock/History Vector Icon Replacement -->
    <div class="stamp-icon-bubble">
      <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <!-- Right Column: Micro Text Information Matrix Stack -->
    <div class="stamp-texts-group">
      <div class="text-row">
        <span class="meta-label">Last Updated:</span>
        <span class="meta-value datetime-highlight">{{ lastUpdatedTime }}</span>
      </div>
      
      <div class="text-row">
        <span class="meta-label">Updated By:</span>
        <div class="profile-tag-wrap">
          <span class="meta-value user-highlight">{{ updatedByUserName }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
