<div class="dense-card">
  <div class="card-header">
    <svg xmlns="http://w3.org" class="section-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
    <h2 class="card-title">2. Contact Information</h2>
  </div>

  <div class="card-content">
    <form [formGroup]="contactForm" class="dense-layout-split">
      
      <!-- Inputs Area (Left Column - Identical flex footprint to card 1) -->
      <div class="inputs-grid-column">
        
        <div class="inputs-row-split">
          <fieldset class="dense-fieldset">
            <legend>Email Address<span class="required">*</span></legend>
            <input type="email" formControlName="email" placeholder="e.g. info@bank.com">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>Customer Care Number<span class="required">*</span></legend>
            <input type="text" formControlName="customerCare" placeholder="Enter number">
          </fieldset>
        </div>

        <fieldset class="dense-fieldset full-width">
          <legend>Website<span class="required">*</span></legend>
          <input type="text" formControlName="website" placeholder="https://...">
        </fieldset>

        <fieldset class="dense-fieldset full-width">
          <legend>Head Office Address<span class="required">*</span></legend>
          <input type="text" formControlName="address" placeholder="Enter address">
        </fieldset>

        <div class="inputs-row-split">
          <fieldset class="dense-fieldset">
            <legend>City<span class="required">*</span></legend>
            <input type="text" formControlName="city" placeholder="Enter city">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>State<span class="required">*</span></legend>
            <input type="text" formControlName="state" placeholder="Enter state">
          </fieldset>
        </div>

        <div class="inputs-row-split">
          <fieldset class="dense-fieldset">
            <legend>Country<span class="required">*</span></legend>
            <input type="text" formControlName="country" placeholder="Enter country">
          </fieldset>

          <fieldset class="dense-fieldset">
            <legend>ZIP Code<span class="required">*</span></legend>
            <input type="text" formControlName="zipCode" placeholder="Enter ZIP code">
          </fieldset>
        </div>

      </div>

      <!-- Map Block Area (Right Sidebar - Exactly matched to the width of card 1) -->
      <div class="map-sidebar">
        <span class="map-label">Office Location</span>
        
        <div class="map-preview-canvas">
          <div class="mock-map-canvas">
            <div class="map-pin">
              <svg xmlns="http://w3.org" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="map-bubble">Head Office</div>
          </div>
        </div>

        <button type="button" class="custom-action-btn map-btn">
          <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 01.553-.894L9 2m0 18l6-3m-6 3V2m6 15l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 2" />
          </svg>
          <span>View on Map</span>
        </button>
      </div>

    </form>
  </div>
</div>
