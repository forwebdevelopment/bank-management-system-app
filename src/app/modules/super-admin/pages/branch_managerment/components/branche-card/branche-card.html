<div class="metrics-grid-container">

  <!-- CARD 1: Total Branches -->
  <mat-card class="kpi-card-wrapper">
    <div class="card-body-layout">
      <div class="icon-avatar-shape indicator-blue">
        <mat-icon>storefront</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-label">Total Branches</span>
        <h2 class="metric-value">152</h2>
        <div class="trend-indicator status-up">
          <mat-icon>arrow_upward</mat-icon>
          <span class="trend-percentage">12.5%</span>
          <span class="trend-duration">from last month</span>
        </div>
      </div>
    </div>
  </mat-card>

  <!-- CARD 2: Active Branches -->
  <mat-card class="kpi-card-wrapper">
    <div class="card-body-layout">
      <div class="icon-avatar-shape indicator-green">
        <mat-icon>check_circle</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-label">Active Branches</span>
        <h2 class="metric-value">128</h2>
        <div class="trend-indicator status-up">
          <mat-icon>arrow_upward</mat-icon>
          <span class="trend-percentage">8.3%</span>
          <span class="trend-duration">from last month</span>
        </div>
      </div>
    </div>
  </mat-card>

  <!-- CARD 3: Inactive Branches -->
  <mat-card class="kpi-card-wrapper">
    <div class="card-body-layout">
      <div class="icon-avatar-shape indicator-red">
        <mat-icon>cancel</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-label">Inactive Branches</span>
        <h2 class="metric-value">24</h2>
        <div class="trend-indicator status-down">
          <mat-icon>arrow_downward</mat-icon>
          <span class="trend-percentage">-3.1%</span>
          <span class="trend-duration">from last month</span>
        </div>
      </div>
    </div>
  </mat-card>

  <!-- CARD 4: Total Branch Managers -->
  <mat-card class="kpi-card-wrapper">
    <div class="card-body-layout">
      <div class="icon-avatar-shape indicator-orange">
        <mat-icon>person</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-label">Total Branch Managers</span>
        <h2 class="metric-value">152</h2>
        <div class="trend-indicator status-up">
          <mat-icon>arrow_upward</mat-icon>
          <span class="trend-percentage">10.6%</span>
          <span class="trend-duration">from last month</span>
        </div>
      </div>
    </div>
  </mat-card>

</div>
