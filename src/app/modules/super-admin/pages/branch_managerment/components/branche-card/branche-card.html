<div class="kpi-grid-container">

  <!-- Dynamic Card Loop Wrapper -->
  <mat-card *ngFor="let card of kpiItemsList" class="kpi-micro-card mat-elevation-z0">
    <mat-card-content class="card-interior-layout">
      
      <!-- Top Row: Icon Badge & Metric Values -->
      <div class="metrics-row-split">
        <div class="icon-circle-badge" [ngClass]="card.iconClass">
          <mat-icon class="kpi-badge-icon">{{ card.icon }}</mat-icon>
        </div>
        
        <div class="labels-text-stack">
          <span class="kpi-title-label">{{ card.title }}</span>
          <span class="kpi-count-number">{{ card.count }}</span>
        </div>
      </div>

      <!-- Bottom Row: High-Density Micro Growth Trend Sub-labels -->
      <div class="trend-row-footer" [ngClass]="card.trendClass">
        <mat-icon class="trend-arrow-icon">
          {{ card.trendDirection === 'up' ? 'arrow_upward' : 'arrow_downward' }}
        </mat-icon>
        <span class="trend-percentage-text">{{ card.trendText }}</span>
      </div>

    </mat-card-content>
  </mat-card>

</div>
