<div class="header-action-container">
  
  <!-- Left Side: Title and Subtitle -->
  <div class="title-group-pane">
    <h2 class="main-heading-text">Branch Management</h2>
    <p class="subtitle-caption-text">Manage all bank branches across the organization.</p>
  </div>

  <!-- Right Side: Action Tool Buttons -->
  <div class="actions-button-group">
    
    <button mat-flat-button color="primary" class="dense-action-btn primary-add-btn" (click)="onAddBranch()">
      <mat-icon class="btn-micro-icon">add</mat-icon>
      <span>Add Branch</span>
    </button>

    <button mat-stroked-button class="dense-action-btn utility-btn" (click)="onExport()">
      <mat-icon class="btn-micro-icon">ios_share</mat-icon>
      <span>Export</span>
    </button>

    <button mat-stroked-button class="dense-action-btn utility-btn" (click)="onRefresh()">
      <mat-icon class="btn-micro-icon">refresh</mat-icon>
      <span>Refresh</span>
    </button>

  </div>

</div>
