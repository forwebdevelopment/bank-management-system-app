<div class="header-component-wrapper">
  
  <!-- Left Side: Title and Subtitle Block Content Segment -->
  <div class="title-meta-group">
    <h1 class="main-title">Branch Management</h1>
    <p class="subtitle-text">Manage all bank branches across the organization.</p>
  </div>

  <!-- Right Side: Angular Material Action Controls Button Group -->
  <div class="action-control-group">
    
    <button mat-flat-button color="primary" class="action-btn btn-add">
      <mat-icon class="mat-icon-sharp">add</mat-icon>
      <span class="btn-label">Add Branch</span>
    </button>

    <button mat-stroked-button class="action-btn btn-export">
      <mat-icon class="mat-icon-sharp">download</mat-icon>
      <span class="btn-label">Export</span>
    </button>

    <button mat-icon-button class="btn-refresh" aria-label="Refresh branch data directory table">
      <mat-icon class="mat-icon-sharp">refresh</mat-icon> 
    </button>
    
  </div>

</div>
