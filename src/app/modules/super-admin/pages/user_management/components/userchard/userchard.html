<div class="metrics-grid">
  
  <!-- Card 1: Total Users -->
  <mat-card class="stat-card">
    <mat-card-content class="card-body">
      <div class="card-top">
        <div class="icon-wrapper blue-theme">
          <mat-icon>person</mat-icon>
        </div>
        <div class="text-info">
          <span class="label">Total Users</span>
          <h2 class="value">1,248</h2>
        </div>
      </div>
      <div class="card-trend">
        <span class="trend-indicator positive">
          <mat-icon>arrow_upward</mat-icon> 12.6%
        </span>
        <span class="trend-period">from last month</span>
      </div>
      <div class="sparkline-wrapper">
        <!-- SVG Sparkline placeholder matching your mockup line perfectly -->
        <svg viewBox="0 0 100 20" preserveAspectRatio="none" class="sparkline blue-line">
          <path d="M0,18 Q15,15 25,12 T50,14 T75,10 T100,5" fill="none" stroke-width="2" />
        </svg>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 2: Active Users -->
  <mat-card class="stat-card">
    <mat-card-content class="card-body">
      <div class="card-top">
        <div class="icon-wrapper green-theme">
          <mat-icon>person</mat-icon>
        </div>
        <div class="text-info">
          <span class="label">Active Users</span>
          <h2 class="value">1,087</h2>
        </div>
      </div>
      <div class="card-trend">
        <span class="trend-indicator positive">
          <mat-icon>arrow_upward</mat-icon> 8.4%
        </span>
        <span class="trend-period">from last month</span>
      </div>
      <div class="sparkline-wrapper">
        <svg viewBox="0 0 100 20" preserveAspectRatio="none" class="sparkline green-line">
          <path d="M0,15 Q15,18 30,12 T60,15 T85,8 T100,6" fill="none" stroke-width="2" />
        </svg>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 3: Inactive Users -->
  <mat-card class="stat-card">
    <mat-card-content class="card-body">
      <div class="card-top">
        <div class="icon-wrapper red-theme">
          <mat-icon>person_off</mat-icon>
        </div>
        <div class="text-info">
          <span class="label">Inactive Users</span>
          <h2 class="value">98</h2>
        </div>
      </div>
      <div class="card-trend">
        <span class="trend-indicator negative">
          <mat-icon>arrow_downward</mat-icon> -3.2%
        </span>
        <span class="trend-period">from last month</span>
      </div>
      <div class="sparkline-wrapper">
        <svg viewBox="0 0 100 20" preserveAspectRatio="none" class="sparkline red-line">
          <path d="M0,12 Q20,18 40,10 T70,16 T100,11" fill="none" stroke-width="2" />
        </svg>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 4: Administrators -->
  <mat-card class="stat-card">
    <mat-card-content class="card-body">
      <div class="card-top">
        <div class="icon-wrapper purple-theme">
          <mat-icon>admin_panel_settings</mat-icon>
        </div>
        <div class="text-info">
          <span class="label">Administrators</span>
          <h2 class="value">63</h2>
        </div>
      </div>
      <div class="card-trend">
        <span class="trend-indicator positive">
          <mat-icon>arrow_upward</mat-icon> 6.7%
        </span>
        <span class="trend-period">from last month</span>
      </div>
      <div class="sparkline-wrapper">
        <svg viewBox="0 0 100 20" preserveAspectRatio="none" class="sparkline purple-line">
          <path d="M0,17 Q15,16 35,12 T65,14 T100,7" fill="none" stroke-width="2" />
        </svg>
      </div>
    </mat-card-content>
  </mat-card>

</div>
