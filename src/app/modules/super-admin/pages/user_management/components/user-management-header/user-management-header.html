<div class="header-container">
  <!-- Left Side Block: Fluid Typography Headers -->
  <div class="title-group">
    <h1 class="main-title">User Management</h1>
    <p class="sub-title">Create, manage and monitor all system users across bank branches.</p>
  </div>

  <!-- Right Side Block: Dynamic Flow Flex Actions -->
  <div class="action-group">
    <button mat-flat-button color="primary" class="btn-action btn-add">
      <mat-icon>add</mat-icon>
      <span class="btn-text">Add User</span>
    </button>

    <button mat-stroked-button class="btn-action btn-secondary">
      <mat-icon>file_download</mat-icon>
      <span class="btn-text">Export Users</span>
    </button>

    <button mat-stroked-button class="btn-action btn-secondary btn-refresh" aria-label="Refresh data">
      <mat-icon>refresh</mat-icon>
      <span class="btn-text">Refresh</span>
    </button>
  </div>
</div>
