<div class="user-mgmt-container">
  <!-- Left Side: Main Scrollable Workspace (Sections 1-4) -->
  <main class="workspace-panel">
    
    <!-- Section 1: Page Header Component Tag -->
    <header class="layout-header">
      <app-user-management-header></app-user-management-header>
    </header>

    <!-- Section 2: Metrics Cards Component Tag -->
    <section class="layout-metrics">
       <app-userchard></app-userchard>
    </section>

    <!-- Section 3: Filters and Directory Table Component Tag -->
    <section class="layout-directory mat-elevation-z1">
     <app-userlist (viewDetials)="opendetials($event)"></app-userlist>
    </section>

    <!-- Section 4: Quick Actions Bar Component Tag -->
    <footer class="layout-quick-actions">

       <app-action></app-action>
    </footer>

  </main>


  <!-- Right Side: Section 5 Detail Panel Component Tag -->
   @if (isSeeUserDetials) {
  <aside class="details-panel mat-elevation-z1">
     <app-user-details (closeDetails)="closeDetails()"></app-user-details>
  </aside>
}
</div>
