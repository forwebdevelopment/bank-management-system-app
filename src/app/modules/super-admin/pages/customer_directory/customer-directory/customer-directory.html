<div class="customer-directory-layout">

  <!-- LEFT WORKSPACE: Holds Directory Header, KPI metrics, and Tables -->
  <main class="directory-workspace">
    
    <!-- <div class="layout-box section-1-slot">
      <p>Section 1: Directory Header Slot</p>
    </div> -->
    <app-customer-header></app-customer-header>

   <app-summary-card></app-summary-card>

   <app-customer-list
    (customerSelected)="selectedCustomer = $event"></app-customer-list>

  </main>

  <!-- RIGHT INSPECTION DRAWER: Adapts position depending on viewport break rules -->
   @if (selectedCustomer) {
  <aside class="profile-drawer" >
    <!-- <div class="layout-box section-4-slot">
      <p>Section 4: Profile Sidebar Slot</p>
    </div> -->
    <app-customer-details
     [customer]="selectedCustomer"
    (closePanel)="selectedCustomer = null"
    ></app-customer-details>
  </aside>
   }
</div>
