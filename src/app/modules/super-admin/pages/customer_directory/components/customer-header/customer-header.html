<header class="directory-header">
  <!-- Left Side: Title & Subtext -->
  <div class="title-container">
    <h1 class="main-title">Customer Directory</h1>
    <p class="subtitle">Monitor and search customer records across all bank branches.</p>
  </div>

  <!-- Right Side: Action Buttons -->
  <div class="action-container">
    <button mat-stroked-button color="primary" class="btn-action">
      <mat-icon>file_download</mat-icon>
      <span>Export Customers</span>
    </button>

    <button mat-stroked-button color="primary" class="btn-action">
      <mat-icon>print</mat-icon>
      <span>Print Directory</span>
    </button>

    <button mat-flat-button color="primary" class="btn-refresh">
      <mat-icon>refresh</mat-icon>
      <span>Refresh</span>
    </button>
  </div>
</header>
