<!-- SECTION 1: Customer Directory Header Area -->
<header class="directory-header-container">
  
  <!-- Left Side: Titles -->
  <div class="header-titles">
    <h1 class="main-title">Customer Directory</h1>
    <p class="sub-title">Monitor and search customer records across all bank branches.</p>
  </div>

  <!-- Right Side: Angular Material Actions Block -->
  <div class="header-actions">
    
    <button mat-stroked-button class="action-btn secondary-btn" type="button">
      <mat-icon class="btn-icon">cloud_download</mat-icon>
      <span class="btn-text">Export Customers</span>
    </button>

    <button mat-stroked-button class="action-btn secondary-btn" type="button">
      <mat-icon class="btn-icon">print</mat-icon>
      <span class="btn-text">Print Directory</span>
    </button>

    <button mat-flat-button color="primary" class="action-btn primary-blue-btn" type="button">
      <mat-icon class="btn-icon">refresh</mat-icon>
      <span class="btn-text">Refresh</span>
    </button>

  </div>
</header>
