<header class="banking-header-panel">
  <!-- Left Side: Title and Subtext Description -->
  <div class="header-info-segment">
    <h1 class="header-title">Role & Permission Management</h1>
    <p class="header-subtitle">Create roles and define access permissions for every module in the banking system.</p>
  </div>

  <!-- Right Side: Exact Actions Row Layout -->
  <div class="header-actions-segment">
    <button mat-flat-button class="btn-banking-primary">
      <mat-icon class="icon-small">add</mat-icon>
      Create Role
    </button>
    
    <button mat-stroked-button class="btn-banking-secondary">
      <mat-icon class="icon-small">content_copy</mat-icon>
      Duplicate Role
    </button>
    
    <button mat-stroked-button class="btn-banking-secondary">
      <mat-icon class="icon-small">upload</mat-icon>
      Export Permissions
    </button>
    
    <button mat-stroked-button class="btn-banking-secondary">
      <mat-icon class="icon-small">refresh</mat-icon>
      Refresh
    </button>
  </div>
</header>
