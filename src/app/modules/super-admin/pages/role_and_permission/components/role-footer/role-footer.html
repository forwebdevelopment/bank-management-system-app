<mat-card class="aggregate-footer-container">
  <mat-card-content class="footer-grid-body">
    
    <!-- Stat Block 1: Modules Accessible -->
    <div class="footer-stat-node theme-blue">
      <div class="stat-icon-circle">
        <mat-icon>apps</mat-icon>
      </div>
      <div class="stat-text-meta">
        <span class="stat-label-title">Modules Accessible</span>
        <h4 class="stat-numeric-value">16</h4>
        <span class="stat-subtitle-text text-blue">All major modules</span>
      </div>
    </div>

    <!-- Stat Block 2: Total Permissions -->
    <div class="footer-stat-node theme-green">
      <div class="stat-icon-circle">
        <mat-icon>vpn_key</mat-icon>
      </div>
      <div class="stat-text-meta">
        <span class="stat-label-title">Total Permissions</span>
        <h4 class="stat-numeric-value">114</h4>
        <span class="stat-subtitle-text text-green">Granted: 109</span>
      </div>
    </div>

    <!-- Stat Block 3: Restricted Modules -->
    <div class="footer-stat-node theme-orange">
      <div class="stat-icon-circle">
        <mat-icon>security</mat-icon>
      </div>
      <div class="stat-text-meta">
        <span class="stat-label-title">Restricted Modules</span>
        <h4 class="stat-numeric-value">2</h4>
        <span class="stat-subtitle-text text-orange">Limited access</span>
      </div>
    </div>

    <!-- Stat Block 4: Approval Rights -->
    <div class="footer-stat-node theme-purple">
      <div class="stat-icon-circle">
        <mat-icon>verified</mat-icon>
      </div>
      <div class="stat-text-meta">
        <span class="stat-label-title">Approval Rights</span>
        <h4 class="stat-numeric-value">8</h4>
        <span class="stat-subtitle-text text-purple">Modules</span>
      </div>
    </div>

  </mat-card-content>
</mat-card>
