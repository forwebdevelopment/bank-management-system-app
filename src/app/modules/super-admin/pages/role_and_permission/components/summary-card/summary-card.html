<div class="metrics-row-container">
  
  <!-- Card 1: Total Roles -->
  <mat-card class="metric-card theme-blue">
    <mat-card-content class="metric-card-content">
      <div class="icon-square-avatar">
        <mat-icon>shield</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-title">Total Roles</span>
        <div class="metric-numeric-row">
          <h2 class="metric-value">4</h2>
          <span class="trend-badge trend-up">
            <mat-icon>arrow_upward</mat-icon>
            2 this month
          </span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 2: Total Users Assigned -->
  <mat-card class="metric-card theme-green">
    <mat-card-content class="metric-card-content">
      <div class="icon-square-avatar">
        <mat-icon>group</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-title">Total Users Assigned</span>
        <div class="metric-numeric-row">
          <h2 class="metric-value">128</h2>
          <span class="trend-badge trend-up">
            <mat-icon>arrow_upward</mat-icon>
            18 this month
          </span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 3: Permission Groups -->
  <mat-card class="metric-card theme-purple">
    <mat-card-content class="metric-card-content">
      <div class="icon-square-avatar">
        <mat-icon>lock</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-title">Permission Groups</span>
        <div class="metric-numeric-row">
          <h2 class="metric-value">16</h2>
          <span class="trend-badge trend-up">
            <mat-icon>arrow_upward</mat-icon>
            3 this month
          </span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Card 4: Active Roles -->
  <mat-card class="metric-card theme-orange">
    <mat-card-content class="metric-card-content">
      <div class="icon-square-avatar">
        <mat-icon>settings</mat-icon>
      </div>
      <div class="metric-data-block">
        <span class="metric-title">Active Roles</span>
        <div class="metric-numeric-row">
          <h2 class="metric-value">4</h2>
          <span class="trend-badge trend-flat">
            <mat-icon>trending_flat</mat-icon>
            No change
          </span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

</div>
